Description: |
  Downloads the latest Intellij IDEA disk image and creates a package.

  Downloads both the ARM and Intel builds.

  Based on:  com.github.bnpl.autopkg.download.intellijidea
Identifier: com.github.mlbz521.pkg.IntelliJ-IDEA-Universal
ParentRecipe: com.github.mlbz521.download.IntelliJ-IDEA-Universal
MinimumVersion: "2.3"
Input:
  NAME: Intellij IDEA
  PKG_NAME: Intellij IDEA (Universal)
Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: '"%intel_version%" != "%arm_version%"'
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/pkgroot"
      pkgdirs: {}
  - Processor: PkgRootCreator
    Arguments:
      pkgroot: "%RECIPE_CACHE_DIR%/scripts"
      pkgdirs: {}
  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/downloads/%NAME% (ARM).dmg/%APP_NAME%"
      destination_path: '%RECIPE_CACHE_DIR%/scripts/%ARM_ARCHITECTURE%/%APP_NAME%'
  - Processor: Copier
    Arguments:
      source_path: "%RECIPE_CACHE_DIR%/downloads/%NAME% (Intel).dmg/%APP_NAME%"
      destination_path: '%RECIPE_CACHE_DIR%/scripts/%INTEL_ARCHITECTURE%/%APP_NAME%'
  - Processor: FileCreator
    Arguments:
      file_path: '%RECIPE_CACHE_DIR%/scripts/postinstall'
      file_mode: '0755'
      file_content: |
        #!/bin/bash

        ###################################################################################################
        # Script Name:  Install-UniversalApp.sh
        # By:  Zack Thompson / Created:  11/10/2022
        # Version:  1.1.0 / Updated:  12/5/2022 / By:  ZT
        #
        # Description:  "Installs" the appropriate app bundle based on the systems' architecture.
        #
        ###################################################################################################

        echo -e "*****  Install %NAME% Process:  START  *****\n"

        ##################################################
        # Define Variables

        app_name="%APP_NAME%"

        # Set working directory
        pkg_dir=$( /usr/bin/dirname "${0}" )

        if [[ $( /usr/bin/arch ) == "arm64" ]]; then
            app="%ARM_ARCHITECTURE%/${app_name}"
        else
            app="%INTEL_ARCHITECTURE%/${app_name}"
        fi

        ##################################################
        # Bits staged...

        if [[ $3 != "/" ]]; then
            echo "[ERROR] Target disk is not the startup disk."
            echo -e "\n*****  Install %NAME% Process:  FAILED  *****"
            exit 1
        fi

        # Install App
        echo "Installing..."
        /bin/mv -f "${pkg_dir}/${app}" "/Applications/${app_name}"
        exitCode=$?
        /bin/sleep 1

        if [[ $exitCode != 0 ]]; then
            echo "[ERROR] Install failed!"
            echo "[Exit Code] ${exitCode}"
            echo -e "\n*****  Install %NAME% Process:  FAILED  *****"
            exit 1
        fi

        chown -R root:admin "/Applications/${app_name}"
        chmod -R 0775 "/Applications/${app_name}"

        echo -e "\n*****  Install %NAME% Process:  COMPLETE  *****"
        exit 0
  - Processor: PkgCreator
    Arguments:
      pkg_request:
        id: com.jetbrains.intellij
        options: purge_ds_store
        pkgname: '%NAME%-%arm_version%'
        pkgroot: '%RECIPE_CACHE_DIR%/pkgroot'
        pkgtype: flat
        scripts: '%RECIPE_CACHE_DIR%/scripts'
        version: '%arm_version%'
  - Processor: com.github.mlbz521.SharedProcessors/RenamePath
    Arguments:
      source_path: '%RECIPE_CACHE_DIR%/%NAME%-%arm_version%.pkg'
      new_name: '%RECIPE_CACHE_DIR%/%PKG_NAME%-%arm_version%.pkg'
  - Processor: PathDeleter
    Arguments:
      path_list: 
        - '%RECIPE_CACHE_DIR%/pkgroot'
        - '%RECIPE_CACHE_DIR%/scripts'
