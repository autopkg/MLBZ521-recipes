Description: Downloads the latest version of VH Dissector Pro and creates a pkg.
Identifier: com.github.mlbz521.pkg.VHDissectorPro
ParentRecipe: com.github.mlbz521.download.VHDissectorPro
MinimumVersion: "2.3"
Input:
  NAME: VH Dissector Pro
  PKG_NAME: VH Dissector Pro (Universal)
Process:
  - Processor: AppPkgCreator
    Arguments:
      app_path: "%RECIPE_CACHE_DIR%/unzipped/*.app"
  - Processor: com.github.mlbz521.SharedProcessors/RenamePath
    Arguments:
      source_path: "%pkg_path%"
      new_name: "%PKG_NAME%-%version%.pkg"
  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unzipped"
