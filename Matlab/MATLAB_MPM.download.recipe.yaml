Description: |
  Downloads the latest version using the "MATLAB Package Manager" (mpm) CLI utility.
  (See:  https://www.mathworks.com/help/install/ug/get-mpm-os-command-line.html)

  Input Variables:
    * MPM_ARCH = This is for the device running this recipe, use:
      * `maca64` for ARM
      * `maci64` for Intel
    * DL_VERSION = optionally specify version of MATLAB to download, otherwise the latest release
        will be downloaded
    * REMOVE_UNSUPPORTED_PKGS = Specific packages are not support by specific architectures, but
        mpm doesn't track compatibility, so if an install fails, this recipes processes will remove
        the incompatible packages and try again.
    * INSTALLER_INPUT_CONFIG should be a yaml mapping (Python/Plist dict)
      * Where the key values can be found in individual MATLAB mpm input files 
          (https://github.com//mathworks-ref-arch/matlab-dockerfile/tree/main/mpm-input-files)
        * Or "all" can be used and all the options will be dynamically pulled
      * INSTALLER_INPUT_CONFIG
        * updateLevel = Specify the specific update release, otherwise get the latest release
        * platforms = The architecture to download for.  Technically, in addition to
            macOS Intel/ARM, this can support Windows and Linux as well.
        * products = The MATLAB 'products' to download.
        * support_packages = The MATLAB 'support packages' to download.
        * optional_features = The MATLAB 'optional features' to download.

  For information on how this recipe works, please see the README
    in my repo (https://github.com/autopkg/MLBZ521-recipes/blob/master/ReadMe.md).
Identifier: com.github.mlbz521.download.MATLAB_MPM
Input:
  NAME: MATLAB
  MPM_ARCH: maca64
  # DL_VERSION: 
  REMOVE_UNSUPPORTED_PKGS: "true"
  INSTALLER_INPUT_CONFIG:
    # updateLevel: "0"
    platforms: 
      - maca64
    products: all # `all` OR `[yaml list of items]`
    support_packages: [] # `all` OR `[yaml list of items]`
    optional_features: [] # `all` OR `[yaml list of items]`
Process:
  - Processor: URLDownloader
    Arguments:
      url: 'https://www.mathworks.com/mpm/%MPM_ARCH%/mpm'
      prefetch_filename: True
  - Processor: com.github.mlbz521.SharedProcessors/FileMode
    Arguments:
      file_mode: "0755"
      file_path: '%pathname%'
  - Processor: DownloadMATLABProcessor
    Arguments:
      mpm_path: '%pathname%'
      dl_version: '%DL_VERSION%'
      # installer_input_config:  '%INSTALLER_INPUT_CONFIG%'
      # autopkg doesn't currently support non-string value types, so it can't be parsed and passed
      remove_unsupported_pkgs: '%REMOVE_UNSUPPORTED_PKGS%'
  - Processor: EndOfCheckPhase
